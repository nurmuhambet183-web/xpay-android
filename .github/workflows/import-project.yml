
name: Import Xpay ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir unpack
          unzip -q Xpay-GitHub.zip -d unpack
          rsync -a --exclude='.github/workflows/build-apk.yml' unpack/xpay-android-ready/ ./
          rm -rf unpack Xpay-GitHub.zip

      - name: Save project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Xpay Android project"
          git push
          
